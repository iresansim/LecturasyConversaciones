<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturas y Conversaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="canvas">
        <header>
            <div class="logo">Lecturas y Conversaciones</div>
            <nav>
                <a href="#next-session-section">Próxima Sesión</a>
                <a href="#proposals-section">Propuestas</a>
                <a href="#history-section">Historial</a>
            </nav>
        </header>

        <!-- Apartado 01: Próxima Sesión -->
        <div id="next-session-section" style="grid-column: 2 / 7; grid-row: 2 / 4; display: flex; flex-direction: column; gap: var(--space-md); margin-top: var(--space-xl); z-index: 2;">
            <div class="meta-label">
                <span class="num">01</span> PRÓXIMA SESIÓN
            </div>
            <div id="next-session-content">
                 <!-- Inyectado por JS: Título, Autor, Fecha, Hora, Link -->
            </div>
        </div>

        <!-- Portada en el Apartado 01 (Lado derecho) -->
        <div class="img-block img-portrait" id="current-cover" style="grid-column: 8 / 13; grid-row: 2 / 5; margin-top: var(--space-xl);">
        </div>

        <!-- Apartado 02: Próximos Libros Propuestos -->
        <div id="proposals-section" class="hero-content" style="grid-row: 4 / 5;">
            <div class="meta-label">
                <span class="num">02</span> PRÓXIMOS LIBROS PROPUESTOS
            </div>
            <div id="proposals-list">
                 <!-- Propuestas o mensaje para @Cris inyectado aquí -->
            </div>
        </div>

        <!-- Apartado 03: Historial -->
        <div class="section-timeline" id="history-section" style="grid-row: 6;">
            <div class="meta-label">
                <span class="num">03</span> HISTORIAL DEL CLUB
            </div>
            <div id="timeline">
                <!-- Contenido inyectado por main.js -->
            </div>
        </div>

        <!-- Apartado 04: En el Tintero -->
        <div id="tintero-section" style="grid-column: 2 / 7; margin-top: var(--space-md); z-index: 2; padding-bottom: var(--space-xl); grid-row: 7;">
            <div class="meta-label">
                <span class="num">04</span> EN EL TINTERO
            </div>
            <div id="external-list"></div>

            <!-- Pie de página personalizado -->
            <div style="grid-column: 1 / -1; margin-top: 4rem; padding: 2rem var(--space-md); border-top: 1px solid var(--border-light); opacity: 0.8; text-align: center;">
                <p style="font-family: var(--font-sans); font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase;">
                    Lecturas y Conversaciones hecho con ❤️ para Ana, Anna, Cris, Elena, Juan, Lore, Vane y Marina
                </p>
            </div>
        </div>

    </main>
    <!-- Cargamos los datos primero y luego la lógica (sin type="module") -->
    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
