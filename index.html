<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturas y Conversaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="canvas">
        <header>
            <div class="logo">Lecturas y Conversaciones</div>
            <nav>
                <a href="#next-session-section">Próxima Sesión</a>
                <a href="#proposals-section">Propuestas</a>
                <a href="#history-section">Historial</a>
            </nav>
        </header>

        <!-- Apartado 01: Próxima Sesión -->
        <div id="next-session-section" class="section-next">
            <div class="meta-label">
                <span class="num">01</span> PRÓXIMA SESIÓN
            </div>
            <div id="next-session-content">
                 <!-- Inyectado por JS: Título, Autor, Fecha, Hora, Link -->
            </div>
        </div>

        <!-- Portada en el Apartado 01 (Lado derecho) -->
        <div class="img-block img-portrait" id="current-cover">
        </div>

        <!-- Apartado 02: Próximos Libros Propuestos -->
        <div id="proposals-section" class="hero-content section-proposals">
            <div class="meta-label">
                <span class="num">02</span> PRÓXIMOS LIBROS PROPUESTOS
            </div>
            <div id="proposals-list">
                 <!-- Propuestas o mensaje para @Cris inyectado aquí -->
            </div>
        </div>

        <!-- Apartado 03: Historial -->
        <div class="section-timeline" id="history-section">
            <div class="meta-label">
                <span class="num">03</span> HISTORIAL DEL CLUB
            </div>
            <div id="timeline">
                <!-- Contenido inyectado por main.js -->
            </div>
        </div>

        <!-- Apartado 04: En el Tintero -->
        <div id="tintero-section" class="section-tintero">
            <div class="meta-label">
                <span class="num">04</span> EN EL TINTERO
            </div>
            <div id="external-list"></div>

            <!-- Pie de página personalizado -->
            <footer class="main-footer">
                <p>Lecturas y Conversaciones hecho con ❤️ para Ana, Anna, Cris, Elena, Juan, Lore, Vane y Marina</p>
            </footer>
        </div>

    </main>
    <!-- Cargamos los datos primero y luego la lógica (sin type="module") -->
    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
